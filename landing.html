<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Re Wallet</title>
  </head>

  <body>

    <div class="lab-shell">
  <header class="topbar">
    <div class="brand">
      <img src="/rewallet-lockup-black.png" alt="Re Wallet" class="brand-mark" />
    </div>

    <div class="date-stamp">
      <button class="demo-btn">Demo Devnet</button>
    </div>
  </header>

  <main>
    <!-- INTRO / LANDING -->
    <section class="intro-screen screen active" data-screen="0">
      <div class="intro-grid">
        <div class="intro-copy">
          <p class="eyebrow">ANNUAL COMPATIBILITY TEST</p>

          <h1>
            Sorry,
            <span>Right-Handed Folks.</span>
          </h1>

          <p class="lead">
            You’ll have to adapt for a change.
          </p>

          <p class="intro-text">
            For the next few minutes, ordinary objects have been
            inconveniently configured around someone else.
          </p>

          <div class="email-input">
            <input type="email" placeholder="your@email.com" id="emailInput">
            <button class="primary-btn" id="startBtn">
              ENTER LEFT MODE
              <span>←</span>
            </button>
          </div>
        </div>

        <div class="hand-poster">
          <div class="poster-number">10%</div>
          <div class="hand-icon">✋</div>

          <p>
            APPROXIMATE HUMAN POPULATION
            <strong>LEFT-HANDED</strong>
          </p>

          <div class="poster-warning">
            WORLD DEFAULT:
            <b>RIGHT</b>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="progress">
    <span id="progressLabel">INTRO</span>

    <div class="progress-track">
      <div id="progressFill"></div>
    </div>

    <span>LEFT//MODE</span>
  </div>

  <div class="confetti-field" id="confettiField"></div>
</div>

  <script src="./script.js"></script>
  </body>
</html>
